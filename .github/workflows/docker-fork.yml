name: Docker Fork Branch Image

on:
#  schedule:
#    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Fork branch to build (forces rebuild). Empty = scan all branches."
        required: false
        type: string

env:
  GIT_REPO: supertypo/rusty-kaspa
  ARTIFACTS: kaspad

permissions:
  contents: read
  actions: write

# Single-flight: while a build is running, extra scheduled scans queue up (at most one)
# and turn into a no-op once the running build has pushed its <branch>-<sha> tag.
concurrency:
  group: docker-fork
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ vars.DOCKER_LEGACY_REPO }}
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.scan.outputs.branches }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      # Scheduled workflows are disabled by GitHub after 60 days without repo activity;
      # re-enabling on every run resets that timer without creating commits.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/docker-fork.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Scan fork branches
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          matrix="[]"
          while IFS=$'\t' read -r name sha; do
            if [ -n "$INPUT_BRANCH" ]; then
              # Explicit dispatch: build only the requested branch, unconditionally
              [ "$name" = "$INPUT_BRANCH" ] || continue
            else
              # Scheduled scan: master only tracks upstream, skip it
              [ "$name" = "master" ] && continue
            fi
            sanitized=$(echo "$name" | tr '/' '-')
            short=${sha:0:7}
            # The pinned <branch>-<sha> tag doubles as the "already built" marker;
            # the -failed marker prevents endless retries of a broken build
            # (retry via a new push or a manual dispatch of this workflow).
            if [ -z "$INPUT_BRANCH" ]; then
              if docker manifest inspect "${{ vars.DOCKER_LEGACY_REPO }}:$sanitized-$short" >/dev/null 2>&1 \
                || docker manifest inspect "${{ vars.DOCKER_LEGACY_REPO }}:$sanitized-$short-failed" >/dev/null 2>&1; then
                continue
              fi
            fi
            echo "Queueing $name @ $short"
            matrix=$(jq -c --arg name "$name" --arg sanitized "$sanitized" --arg sha "$sha" --arg short "$short" \
              '. + [{name: $name, sanitized: $sanitized, sha: $sha, short: $short}]' <<< "$matrix")
          done < <(gh api "repos/$GIT_REPO/branches" --paginate -q '.[] | [.name, .commit.sha] | @tsv')
          echo "branches=$matrix" >> $GITHUB_OUTPUT
          echo "any=$(jq 'length > 0' <<< "$matrix")" >> $GITHUB_OUTPUT

  build:
    needs: scan
    if: ${{ needs.scan.outputs.any == 'true' }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.scan.outputs.branches) }}
        target:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.target.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKER_LEGACY_REPO }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: docker

      - name: Checkout external repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GIT_REPO }}
          ref: ${{ matrix.branch.sha }}
          path: rusty-kaspa

      - name: Git describe version
        run: |
          cd rusty-kaspa
          echo "GIT_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      - name: Copy Dockerfile
        run: |
          cp docker/Dockerfile ./Dockerfile
          cp docker/entrypoint.sh ./entrypoint.sh

      - name: Extract Rust version
        run: |
          RUST_VERSION=$(grep '^rust-version' rusty-kaspa/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "RUST_VERSION=$RUST_VERSION" >> $GITHUB_ENV

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.target.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO_DIR=rusty-kaspa
            REPO_URL=${{ env.GIT_REPO }}
            RUSTY_VERSION=${{ env.GIT_VERSION }}
            ARTIFACTS=${{ env.ARTIFACTS }}
            RUST_VERSION=${{ env.RUST_VERSION }}
          target: kaspad
          outputs: type=image,name=${{ vars.DOCKER_LEGACY_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.branch.sanitized }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - scan
      - build
    # always(): one failed branch must not prevent tagging the branches that built fine
    if: ${{ always() && needs.scan.outputs.any == 'true' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.scan.outputs.branches) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.branch.sanitized }}-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Both platform digests must be present; a partial build must not be tagged
          if [ "$(ls -1 | wc -l)" -ne 2 ]; then
            echo "Expected 2 digests for ${{ matrix.branch.name }}, found $(ls -1 | wc -l) - build incomplete"
            exit 1
          fi
          docker buildx imagetools create \
            -t ${{ vars.DOCKER_LEGACY_REPO }}:${{ matrix.branch.sanitized }} \
            -t ${{ vars.DOCKER_LEGACY_REPO }}:${{ matrix.branch.sanitized }}-${{ matrix.branch.short }} \
            $(printf '${{ vars.DOCKER_LEGACY_REPO }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ vars.DOCKER_LEGACY_REPO }}:${{ matrix.branch.sanitized }}
          docker buildx imagetools inspect ${{ vars.DOCKER_LEGACY_REPO }}:${{ matrix.branch.sanitized }}-${{ matrix.branch.short }}

  # Push a tiny scratch-image marker for branches whose build failed, so the
  # scheduled scan does not retry them forever. A new push (new sha) or a
  # manual dispatch retries as usual.
  mark-failed:
    needs:
      - scan
      - build
      - merge
    if: ${{ always() && needs.scan.outputs.any == 'true' && (needs.build.result == 'failure' || needs.merge.result == 'failure') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.scan.outputs.branches) }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push failure marker
        run: |
          tag="${{ vars.DOCKER_LEGACY_REPO }}:${{ matrix.branch.sanitized }}-${{ matrix.branch.short }}"
          # Only mark branches that did not end up with a successful image
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "$tag exists, no marker needed"
            exit 0
          fi
          mkdir marker && cd marker
          touch build-failed
          printf 'FROM scratch\nCOPY build-failed /\n' > Dockerfile
          docker buildx build -f Dockerfile -t "$tag-failed" --push .
